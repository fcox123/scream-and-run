<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Haystack Tycoon: Third Person Searcher</title>
    <style>
        /* ==========================================================================
           GLOBAL & UI STYLES
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* HUD & Overlay Elements */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        .header-bar h1 {
            font-size: 1.4rem;
            color: #f4a261;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-container {
            display: flex;
            gap: 20px;
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-badge span.value {
            color: #e9c46a;
        }

        /* Controls Prompt Overlay */
        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 15px;
        }

        .key {
            background: #f4a261;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Floating Interactive Action Prompts */
        .interactive-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(231, 111, 81, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(231, 111, 81, 0.6);
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.08); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Side Dashboard / Shop Drawer */
        .shop-toggle-btn {
            position: absolute;
            right: 20px;
            top: 100px;
            background: #2a9d8f;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .shop-toggle-btn:hover {
            background: #264653;
            transform: translateY(-2px);
        }

        .shop-panel {
            position: absolute;
            right: -420px;
            top: 0;
            width: 400px;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            z-index: 20;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: #fff;
            border-left: 1px solid rgba(255,255,255,0.1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }

        .shop-panel.open {
            right: 0;
        }

        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .shop-header h2 {
            color: #f4a261;
            font-size: 1.4rem;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover { color: #fff; }

        .shop-items-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 5px;
        }

        /* Scrollbar Styling */
        .shop-items-container::-webkit-scrollbar {
            width: 6px;
        }
        .shop-items-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .upgrade-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background 0.2s;
        }

        .upgrade-card:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .upgrade-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-info h3 {
            font-size: 1rem;
            color: #e9c46a;
        }

        .upgrade-info .level {
            font-size: 0.8rem;
            background: #2a9d8f;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .upgrade-desc {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.3;
        }

        .buy-btn {
            background: #e76f51;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
        }

        .buy-btn:hover:not(:disabled) {
            background: #f4a261;
            color: #000;
        }

        .buy-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        /* Toast Notifications */
        #notification-container {
            position: absolute;
            top: 90px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 30;
            pointer-events: none;
        }

        .toast-msg {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 4px solid #f4a261;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 0.9rem;
            animation: slideIn 0.3s forwards, fadeOut 0.5s 3.5s forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* 3D World Floating Text Canvas Overlay */
        .world-text {
            position: absolute;
            font-weight: bold;
            font-size: 1.4rem;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            animation: floatUp3D 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 15;
        }

        @keyframes floatUp3D {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
        }
    </style>

    <!-- Three.js Library Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 3D RENDER CANVAS CONTAINER -->
    <div id="canvas-container"></div>

    <!-- UI OVERLAY (HUD) -->
    <div id="hud">
        <div class="header-bar">
            <h1>🌾 Haystack Tycoon 3D</h1>
            <div class="stats-container">
                <div class="stat-badge">🌾 Hay: <span id="ui-hay" class="value">0</span></div>
                <div class="stat-badge">🪙 Coins: <span id="ui-coins" class="value">0</span></div>
                <div class="stat-badge">🪡 Needles: <span id="ui-needles" class="value">0</span></div>
            </div>
        </div>

        <button class="shop-toggle-btn" onclick="toggleShop()">🛒 Open Market & Upgrades</button>

        <div class="interactive-prompt" id="action-prompt">Press [E] or Space to Search Haystack</div>

        <div class="controls-hint">
            <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Move</div>
            <div><span class="key">E</span> or <span class="key">Space</span> Interact</div>
            <div><span class="key">Mouse</span> Rotate Camera</div>
        </div>
    </div>

    <!-- NOTIFICATION TOAST CONTAINER -->
    <div id="notification-container"></div>

    <!-- SHOP / UPGRADES PANEL -->
    <div class="shop-panel" id="shop-panel">
        <div class="shop-header">
            <h2>Farmer's Market & Upgrades</h2>
            <button class="close-btn" onclick="toggleShop()">&times;</button>
        </div>

        <!-- FARMER QUICK TRADE -->
        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px;">
            <h3 style="color:#2a9d8f; font-size:1rem; margin-bottom: 8px;">🧑‍🌾 Trade Hay for Coins</h3>
            <p style="font-size:0.85rem; color:#aaa; margin-bottom:12px;">Rate: 1 Hay = 1 Coin</p>
            <div style="display: flex; gap: 8px;">
                <button class="buy-btn" style="flex: 1;" onclick="sellHay(1)">Sell 1</button>
                <button class="buy-btn" style="flex: 1;" onclick="sellHay('half')">Sell 50%</button>
                <button class="buy-btn" style="flex: 1; background:#2a9d8f;" onclick="sellHay('all')">Sell All</button>
            </div>
        </div>

        <h3 style="font-size: 1.1rem; color:#f4a261; margin-top: 10px;">Equipment Upgrades</h3>
        <div class="shop-items-container" id="upgrades-list">
            <!-- Dynamic Injection via JavaScript -->
        </div>
    </div>

    <!-- MAIN GAME ENGINE SCRIPT -->
    <script>
        /* ==========================================================================
           1. AUDIO ENGINE (PROCEDURAL WEB AUDIO SYNTHESIZER)
           ========================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Play procedural sound for picking/searching hay
            playRustle() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let bufferSize = this.ctx.sampleRate * 0.1; // 100ms
                let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                let output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                let whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = buffer;

                let filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.Q.setValueAtTime(3, this.ctx.currentTime);

                let gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                whiteNoise.start();
            }

            // Play sound effect when finding a rare needle
            playNeedleFound() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(1318.51, this.ctx.currentTime + 0.3); // E6

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }

            // Play cash register chime sound on sale
            playCoin() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let now = this.ctx.currentTime;
                
                let osc1 = this.ctx.createOscillator();
                let osc2 = this.ctx.createOscillator();
                let gain = this.ctx.createGain();

                osc1.type = 'triangle';
                osc2.type = 'sine';

                osc1.frequency.setValueAtTime(987.77, now); // B5
                osc2.frequency.setValueAtTime(1318.51, now + 0.08); // E6

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc1.start(now);
                osc1.stop(now + 0.35);
                osc2.start(now + 0.08);
                osc2.stop(now + 0.35);
            }
        }

        const audio = new SoundEngine();

        /* ==========================================================================
           2. GAME DATA STATE & CONFIGURATION
           ========================================================================== */
        let state = {
            hay: 0,
            coins: 0,
            needles: 0,
            clickPower: 1,
            needleChance: 0.01, // 1% Base Chance
            autoHayPerSec: 0,
            autoSellPerSec: 0,
            upgrades: {
                pitchfork: { count: 0, cost: 15, baseCost: 15, power: 1, name: "Iron Pitchfork", desc: "+1 Hay collected per search interaction." },
                detector: { count: 0, cost: 40, baseCost: 40, power: 0.01, name: "Metal Detector", desc: "Increases needle detection chance by +1%." },
                helper: { count: 0, cost: 100, baseCost: 100, power: 2, name: "Farm Hand Helper", desc: "Passively gathers 2 Hay every second." },
                magnet: { count: 0, cost: 300, baseCost: 300, power: 0.025, name: "Super Magnet", desc: "Greatly increases needle discovery chance." },
                trader: { count: 0, cost: 500, baseCost: 500, power: 5, name: "Merchant Contract", desc: "Automatically sells up to 5 Hay/sec." },
                baler: { count: 0, cost: 1500, baseCost: 1500, power: 20, name: "Steam Baler", desc: "Passively gathers 20 Hay every second." }
            }
        };

        /* ==========================================================================
           3. THREE.JS 3D ENGINE & SCENE SETUP
           ========================================================================== */
        let scene, camera, renderer;
        let playerGroup, playerMesh, pitchforkMesh;
        let haystackMesh, farmerMesh, shopAreaMesh;
        let particlesSystem;
        let clock = new THREE.Clock();

        // Control Inputs State
        const keys = { w: false, a: false, s: false, d: false, interact: false };
        let playerPos = new THREE.Vector3(0, 0, 5);
        let playerVelocity = new THREE.Vector3();
        let playerRotation = 0;

        // Interactive Locations Coordinates
        const LOCATIONS = {
            HAYSTACK: new THREE.Vector3(0, 0, 0),
            FARMER: new THREE.Vector3(12, 0, -8)
        };

        function init3D() {
            const container = document.getElementById('canvas-container');

            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 150;
            const d = 30;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Environment Creation
            buildEnvironment();
            buildPlayer();
            buildHaystack();
            buildFarmerNPC();
            buildParticles();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));

            // Initial UI Updates
            renderUpgradesUI();
            updateUI();

            // Start Main Engine Loop
            animate();
        }

        /* ==========================================================================
           4. PROCEDURAL 3D MESH BUILDERS
           ========================================================================== */

        // Build Terrain, Grass, Fences, and Farm Atmosphere
        function buildEnvironment() {
            // Ground Plane
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x557a2b, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Dirt Pathway to Farmer
            const pathGeo = new THREE.PlaneGeometry(4, 25);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 1.0 });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.rotation.z = Math.PI / 4;
            path.position.set(6, 0.01, -4);
            path.receiveShadow = true;
            scene.add(path);

            // Decorative Trees around the Farm
            for (let i = 0; i < 30; i++) {
                let x = (Math.random() - 0.5) * 150;
                let z = (Math.random() - 0.5) * 150;
                if (Math.hypot(x, z) > 20) {
                    createTree(x, z);
                }
            }

            // Simple Farm Fence
            for (let x = -25; x <= 25; x += 10) {
                createFencePost(x, -25);
                createFencePost(x, 25);
            }
        }

        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 4, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2e12 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(2.5, 6, 8);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.8 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 5;
            leaves.castShadow = true;
            treeGroup.add(leaves);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        function createFencePost(x, z) {
            const postGeo = new THREE.BoxGeometry(0.4, 2, 0.4);
            const postMat = new THREE.MeshStandardMaterial({ color: 0x6e4723 });
            const post = new THREE.Mesh(postGeo, postMat);
            post.position.set(x, 1, z);
            post.castShadow = true;
            scene.add(post);
        }

        // Build 3D Character Mesh (Stylized Stylized Farmer)
        function buildPlayer() {
            playerGroup = new THREE.Group();

            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.4, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a9d8f }); // Teal Shirt
            playerMesh = new THREE.Mesh(bodyGeo, bodyMat);
            playerMesh.position.y = 1.1;
            playerMesh.castShadow = true;
            playerGroup.add(playerMesh);

            // Head
            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.0;
            head.castShadow = true;
            playerGroup.add(head);

            // Straw Hat
            const hatBrimGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.05, 16);
            const hatMat = new THREE.MeshStandardMaterial({ color: 0xe9c46a });
            const hatBrim = new THREE.Mesh(hatBrimGeo, hatMat);
            hatBrim.position.y = 2.3;
            playerGroup.add(hatBrim);

            const hatTopGeo = new THREE.CylinderGeometry(0.45, 0.5, 0.4, 16);
            const hatTop = new THREE.Mesh(hatTopGeo, hatMat);
            hatTop.position.y = 2.5;
            playerGroup.add(hatTop);

            // Pitchfork Accessory attached to player
            const forkGroup = new THREE.Group();
            const poleGeo = new THREE.CylinderGeometry(0.04, 0.04, 2.2);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x5c3d11 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            forkGroup.add(pole);

            const prongsGeo = new THREE.BoxGeometry(0.4, 0.3, 0.05);
            const prongsMat = new THREE.MeshStandardMaterial({ color: 0xaaa, metalness: 0.8 });
            const prongs = new THREE.Mesh(prongsGeo, prongsMat);
            prongs.position.y = 1.1;
            forkGroup.add(prongs);

            forkGroup.position.set(0.5, 1.2, 0.2);
            forkGroup.rotation.x = Math.PI / 6;
            pitchforkMesh = forkGroup;
            playerGroup.add(pitchforkMesh);

            playerGroup.position.copy(playerPos);
            scene.add(playerGroup);
        }

        // Build Main Interactive 3D Haystack Giant Pile
        function buildHaystack() {
            const stackGroup = new THREE.Group();

            // Large Central Mound
            const mainGeo = new THREE.SphereGeometry(3.5, 16, 12);
            mainGeo.scale(1.2, 0.7, 1.2);
            const hayMat = new THREE.MeshStandardMaterial({ color: 0xdda15e, roughness: 1.0 });
            const mainPile = new THREE.Mesh(mainGeo, hayMat);
            mainPile.position.y = 1.2;
            mainPile.castShadow = true;
            mainPile.receiveShadow = true;
            stackGroup.add(mainPile);

            // Extra Detail Bales around base
            for (let i = 0; i < 8; i++) {
                let angle = (i / 8) * Math.PI * 2;
                let r = 3.2;
                const detailGeo = new THREE.SphereGeometry(1.2, 8, 8);
                const detailMesh = new THREE.Mesh(detailGeo, hayMat);
                detailMesh.position.set(Math.cos(angle) * r, 0.6, Math.sin(angle) * r);
                detailMesh.castShadow = true;
                stackGroup.add(detailMesh);
            }

            // Floating Needle Graphic Indicator inside Haystack
            const needleGeo = new THREE.CylinderGeometry(0.03, 0.08, 1.8);
            const needleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.1 });
            const needleVisual = new THREE.Mesh(needleGeo, needleMat);
            needleVisual.position.set(0, 3.2, 0);
            needleVisual.rotation.z = Math.PI / 4;
            needleVisual.name = "glowingNeedle";
            stackGroup.add(needleVisual);

            stackGroup.position.copy(LOCATIONS.HAYSTACK);
            haystackMesh = stackGroup;
            scene.add(haystackMesh);
        }

        // Build Farmer NPC Trade Station
        function buildFarmerNPC() {
            const farmerGroup = new THREE.Group();

            // Farmer Body
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xae2012 }); // Red Plaid Shirt
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.1;
            body.castShadow = true;
            farmerGroup.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.4);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.1;
            farmerGroup.add(head);

            // Wooden Trade Counter Stalls
            const counterGeo = new THREE.BoxGeometry(3, 1.2, 1.5);
            const counterMat = new THREE.MeshStandardMaterial({ color: 0x6e4723 });
            const counter = new THREE.Mesh(counterGeo, counterMat);
            counter.position.set(0, 0.6, 1);
            counter.castShadow = true;
            farmerGroup.add(counter);

            farmerGroup.position.copy(LOCATIONS.FARMER);
            farmerMesh = farmerGroup;
            scene.add(farmerMesh);
        }

        // Particle System for Hay Search FX
        function buildParticles() {
            const particleCount = 60;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i++) {
                positions[i] = 0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0xf4a261, size: 0.25, transparent: true, opacity: 0 });
            particlesSystem = new THREE.Points(geometry, material);
            scene.add(particlesSystem);
        }

        function triggerParticleBurst(origin) {
            const positions = particlesSystem.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i] = origin.x + (Math.random() - 0.5) * 2;
                positions[i + 1] = origin.y + Math.random() * 2;
                positions[i + 2] = origin.z + (Math.random() - 0.5) * 2;
            }
            particlesSystem.geometry.attributes.position.needsUpdate = true;
            particlesSystem.material.opacity = 1.0;
        }

        /* ==========================================================================
           5. GAME CONTROLS & INTERACTION ENGINE
           ========================================================================== */

        function handleKey(e, isDown) {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = isDown;
            if (key === 'a') keys.a = isDown;
            if (key === 's') keys.s = isDown;
            if (key === 'd') keys.d = isDown;
            if ((key === 'e' || key === ' ') && isDown) {
                performContextInteraction();
            }
        }

        function performContextInteraction() {
            let distHaystack = playerPos.distanceTo(LOCATIONS.HAYSTACK);
            let distFarmer = playerPos.distanceTo(LOCATIONS.FARMER);

            if (distHaystack < 5.0) {
                searchHaystack3D();
            } else if (distFarmer < 4.0) {
                openShop();
            }
        }

        // Core Hay Searching Mechanic
        function searchHaystack3D() {
            // Animate Pitchfork Swing
            pitchforkMesh.rotation.x = Math.PI / 2;
            setTimeout(() => pitchforkMesh.rotation.x = Math.PI / 6, 200);

            // Play Procedural Rustle Sound Effect
            audio.playRustle();

            // Trigger Particle Burst
            triggerParticleBurst(LOCATIONS.HAYSTACK);

            // Calculate Hay Earned
            let gainedHay = state.clickPower;
            state.hay += gainedHay;

            spawn3DFloatingText(`+${gainedHay} Hay`, LOCATIONS.HAYSTACK, "#f4a261");

            // Roll for Needle Find
            if (Math.random() < state.needleChance) {
                state.needles++;
                let bonusCoins = 100 + Math.floor(Math.random() * 100);
                state.coins += bonusCoins;

                audio.playNeedleFound();
                spawn3DFloatingText(`🪡 NEEDLE FOUND! (+${bonusCoins} Coins)`, LOCATIONS.HAYSTACK, "#e76f51");
                showToast(`🪡 Incredible! You pulled a Needle out of the Haystack! Bonus +${bonusCoins} Coins!`);
            }

            updateUI();
        }

        // Sell Hay to Farmer NPC
        function sellHay(amount) {
            let toSell = 0;
            if (amount === 'all') toSell = state.hay;
            else if (amount === 'half') toSell = Math.floor(state.hay / 2);
            else toSell = Math.min(state.hay, amount);

            if (toSell > 0) {
                state.hay -= toSell;
                state.coins += toSell;
                audio.playCoin();
                spawn3DFloatingText(`+${toSell} Coins 🪙`, LOCATIONS.FARMER, "#2a9d8f");
                showToast(`Sold ${toSell} Hay for ${toSell} Coins!`);
                updateUI();
            } else {
                showToast("No Hay available to sell!");
            }
        }

        /* ==========================================================================
           6. MAIN ANIMATION & TICK LOOP
           ========================================================================== */

        let lastPassiveTick = 0;

        function animate() {
            requestAnimationFrame(animate);

            let delta = clock.getDelta();
            let elapsed = clock.getElapsedTime();

            // Handle Player Physics Movement
            updatePlayerMovement(delta);

            // Third-Person Camera Tracking
            camera.position.x = playerGroup.position.x;
            camera.position.y = playerGroup.position.y + 8;
            camera.position.z = playerGroup.position.z + 12;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);

            // Rotate Floating Needle Visual
            const needleVisual = haystackMesh.getObjectByName("glowingNeedle");
            if (needleVisual) {
                needleVisual.rotation.y = elapsed * 2;
                needleVisual.position.y = 3.2 + Math.sin(elapsed * 3) * 0.2;
            }

            // Fade Out Particle Effects
            if (particlesSystem && particlesSystem.material.opacity > 0) {
                particlesSystem.material.opacity -= delta * 2;
            }

            // Proximity HUD Interaction Check
            checkProximityPrompts();

            // Idle Passive Tycoon Income Loop (Runs every second)
            if (elapsed - lastPassiveTick >= 1.0) {
                passiveIncomeTick();
                lastPassiveTick = elapsed;
            }

            renderer.render(scene, camera);
        }

        function updatePlayerMovement(delta) {
            let moveDir = new THREE.Vector3();

            if (keys.w) moveDir.z -= 1;
            if (keys.s) moveDir.z += 1;
            if (keys.a) moveDir.x -= 1;
            if (keys.d) moveDir.x += 1;

            if (moveDir.length() > 0) {
                moveDir.normalize();
                let speed = 8.0;

                playerPos.x += moveDir.x * speed * delta;
                playerPos.z += moveDir.z * speed * delta;

                // Player Rotation facing movement direction
                let targetRotation = Math.atan2(moveDir.x, moveDir.z);
                playerGroup.rotation.y = targetRotation;

                // Walking Bobbing Animation
                playerMesh.position.y = 1.1 + Math.sin(clock.getElapsedTime() * 12) * 0.1;
            } else {
                playerMesh.position.y = 1.1;
            }

            playerGroup.position.copy(playerPos);
        }

        // Check if player is near interactive structures
        function checkProximityPrompts() {
            const prompt = document.getElementById('action-prompt');
            let distHaystack = playerPos.distanceTo(LOCATIONS.HAYSTACK);
            let distFarmer = playerPos.distanceTo(LOCATIONS.FARMER);

            if (distHaystack < 5.0) {
                prompt.style.display = 'block';
                prompt.innerText = "Press [E] or Space to Search Haystack";
            } else if (distFarmer < 4.0) {
                prompt.style.display = 'block';
                prompt.innerText = "Press [E] or Space to Open Farmer Market";
            } else {
                prompt.style.display = 'none';
            }
        }

        // Passive Income Generation (Auto Collectors & Sellers)
        function passiveIncomeTick() {
            // Auto Harvest
            if (state.autoHayPerSec > 0) {
                state.hay += state.autoHayPerSec;
            }

            // Auto Sell
            if (state.autoSellPerSec > 0 && state.hay > 0) {
                let amountToSell = Math.min(state.hay, state.autoSellPerSec);
                state.hay -= amountToSell;
                state.coins += amountToSell;
            }

            updateUI();
        }

        /* ==========================================================================
           7. SHOP, UPGRADES & UI MANAGEMENT
           ========================================================================== */

        function buyUpgrade(key) {
            let upg = state.upgrades[key];
            if (state.coins >= upg.cost) {
                state.coins -= upg.cost;
                upg.count++;
                upg.cost = Math.floor(upg.baseCost * Math.pow(1.2, upg.count));

                recalculateStats();
                renderUpgradesUI();
                updateUI();
                showToast(`Successfully upgraded ${upg.name}!`);
            } else {
                showToast("Not enough Coins!");
            }
        }

        function recalculateStats() {
            state.clickPower = 1 + (state.upgrades.pitchfork.count * state.upgrades.pitchfork.power);
            state.needleChance = 0.01 + 
                (state.upgrades.detector.count * state.upgrades.detector.power) + 
                (state.upgrades.magnet.count * state.upgrades.magnet.power);
            
            state.autoHayPerSec = (state.upgrades.helper.count * state.upgrades.helper.power) + 
                                  (state.upgrades.baler.count * state.upgrades.baler.power);

            state.autoSellPerSec = (state.upgrades.trader.count * state.upgrades.trader.power);
        }

        function updateUI() {
            document.getElementById('ui-hay').innerText = Math.floor(state.hay).toLocaleString();
            document.getElementById('ui-coins').innerText = Math.floor(state.coins).toLocaleString();
            document.getElementById('ui-needles').innerText = state.needles.toLocaleString();

            // Dynamically check buy button states in shop panel
            for (let key in state.upgrades) {
                let btn = document.getElementById(`buy-btn-${key}`);
                if (btn) {
                    btn.disabled = state.coins < state.upgrades[key].cost;
                }
            }
        }

        function renderUpgradesUI() {
            const container = document.getElementById('upgrades-list');
            container.innerHTML = '';

            for (let key in state.upgrades) {
                let upg = state.upgrades[key];
                let card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <div class="upgrade-info">
                        <h3>${upg.name}</h3>
                        <span class="level">Lvl ${upg.count}</span>
                    </div>
                    <div class="upgrade-desc">${upg.desc}</div>
                    <button class="buy-btn" id="buy-btn-${key}" onclick="buyUpgrade('${key}')">
                        <span>Upgrade</span>
                        <span>🪙 ${upg.cost.toLocaleString()}</span>
                    </button>
                `;
                container.appendChild(card);
            }
        }

        function toggleShop() {
            document.getElementById('shop-panel').classList.toggle('open');
        }

        function openShop() {
            document.getElementById('shop-panel').classList.add('open');
        }

        function showToast(msg) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerText = msg;
            container.appendChild(toast);

            setTimeout(() => toast.remove(), 4000);
        }

        // Floating 3D Projection Text Engine
        function spawn3DFloatingText(text, worldPos, color) {
            const el = document.createElement('div');
            el.className = 'world-text';
            el.innerText = text;
            el.style.color = color;

            // Project 3D vector onto 2D screen coordinates
            const screenPos = worldPos.clone().add(new THREE.Vector3(0, 2.5, 0)).project(camera);
            const x = (screenPos.x * .5 + .5) * window.innerWidth;
            const y = (-(screenPos.y * .5) + .5) * window.innerHeight;

            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 1200);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize 3D Engine on Window Load
        window.onload = init3D;
    </script>
</body>
</html>
