<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flickering Dark Environment Simulation</title>
    <style>
        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Courier New', Courier, monospace;
            color: #d0d0d0;
        }

        /* Ambient Room & Flickering Light */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a1a24 0%, #050508 80%);
            overflow: hidden;
        }

        /* Flickering Ambient Light Layer */
        .ambient-flicker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 240, 200, 0.03);
            pointer-events: none;
            animation: flicker 0.15s infinite alternative;
        }

        @keyframes flicker {
            0% { opacity: 0.1; }
            25% { opacity: 0.8; }
            30% { opacity: 0.2; }
            55% { opacity: 0.9; }
            58% { opacity: 0.0; }
            70% { opacity: 0.7; }
            85% { opacity: 0.1; }
            100% { opacity: 0.6; }
        }

        /* Darkness Overlay */
        #darkness {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.2s ease;
        }

        /* Flashlight Cone Layer */
        #flashlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.1s ease-in-out;
        }

        #flashlight.active {
            opacity: 1;
        }

        /* Scene Elements */
        .wall-texture {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: radial-gradient(#444 1px, transparent 0);
            background-size: 24px 24px;
        }

        .doorway {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 420px;
            border: 8px solid #111;
            border-bottom: none;
            background-color: #020203;
            box-shadow: 0 0 15px rgba(0,0,0,0.9) inset;
        }

        .door-frame {
            width: 100%;
            height: 100%;
            border: 2px solid #222;
            position: relative;
        }

        .knob {
            position: absolute;
            right: 15px;
            top: 50%;
            width: 16px;
            height: 16px;
            background-color: #444;
            border-radius: 50%;
        }

        /* Instructions Overlay */
        #ui {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            text-align: center;
            color: #888;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }

        .key {
            display: inline-block;
            border: 1px solid #666;
            padding: 2px 8px;
            border-radius: 4px;
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        /* Flickering Ceiling Lamp Visual */
        .lamp {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 40px;
            background: #222;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            z-index: 5;
        }

        .bulb {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px #fff;
            animation: bulb-glow 0.15s infinite alternative;
        }

        @keyframes bulb-glow {
            0% { opacity: 0.2; box-shadow: 0 0 2px #fff; }
            50% { opacity: 1; box-shadow: 0 0 25px #fff, 0 0 50px #ffea9f; }
            100% { opacity: 0.1; box-shadow: 0 0 0px #fff; }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="ambient-flicker"></div>
        <div class="wall-texture"></div>
        
        <div class="lamp">
            <div class="bulb"></div>
        </div>

        <div class="doorway">
            <div class="door-frame">
                <div class="knob"></div>
            </div>
        </div>

        <div id="darkness"></div>
        <div id="flashlight"></div>

        <div id="ui">
            Press <span class="key">F</span> to toggle flashlight
        </div>
    </div>

    <script>
        const darkness = document.getElementById('darkness');
        const flashlight = document.getElementById('flashlight');
        let isFlashlightOn = false;
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        // Toggle Flashlight State
        window.addEventListener('keydown', (e) => {
            if (e.key === 'f' || e.key === 'F') {
                isFlashlightOn = !isFlashlightOn;
                
                if (isFlashlightOn) {
                    flashlight.classList.add('active');
                    darkness.style.opacity = '0.35';
                } else {
                    flashlight.classList.remove('active');
                    darkness.style.opacity = '0.96';
                }
            }
        });

        // Track Mouse Movement for Flashlight Effect
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            updateFlashlight();
        });

        function updateFlashlight() {
            if (!isFlashlightOn) return;

            // Creates a realistic flashlight beam using radial gradient tracking cursor
            flashlight.style.background = `radial-gradient(
                circle 180px at ${mouseX}px ${mouseY}px, 
                rgba(255, 253, 230, 0.95) 0%, 
                rgba(255, 245, 200, 0.5) 40%, 
                rgba(0, 0, 0, 0.8) 80%, 
                rgba(0, 0, 0, 0.95) 100%
            )`;
        }

        // Initialize position
        updateFlashlight();
    </script>
</body>
</html>
