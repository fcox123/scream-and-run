<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Whisper in the Woods</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: monospace; overflow: hidden; }
        #gameCanvas { display: none; background: #050505; }
        #ui { position: absolute; top: 10px; left: 10px; display: none; }
        #cutscene { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #subtitles { color: #8b0000; font-size: 24px; margin-top: 20px; height: 30px; text-align: center; }
        button { padding: 12px 24px; font-size: 18px; background: #222; color: #fff; border: 1px solid #444; cursor: pointer; }
        button:hover { background: #444; }
    </style>
</head>
<body>

<div id="cutscene">
    <button id="playBtn" onclick="startCutscene()">PLAY</button>
    <div id="subtitles"></div>
</div>

<div id="ui">Keys Found: <span id="keyCount">0</span>/4</div>
<canvas id="gameCanvas"></canvas>

<script>
const cutsceneDiv = document.getElementById('cutscene');
const subtitles = document.getElementById('subtitles');
const playBtn = document.getElementById('playBtn');

function speak(text, callback) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.pitch = 0.1;
    utterance.rate = 0.5;
    utterance.onend = callback;
    window.speechSynthesis.speak(utterance);
}

function startCutscene() {
    playBtn.style.display = 'none';
    
    const lines = [
        "MUM...",
        "MUM...",
        "WHERE WERE YOU...",
        "WHY DIDN'T YOU SAVE ME..."
    ];
    
    let index = 0;
    
    function playNextLine() {
        if (index < lines.length) {
            subtitles.innerText = lines[index];
            speak(lines[index], () => {
                index++;
                setTimeout(playNextLine, 800);
            });
        } else {
            startGame();
        }
    }
    
    playNextLine();
}

function startGame() {
    cutsceneDiv.style.display = 'none';
    document.getElementById('ui').style.display = 'block';
    const canvas = document.getElementById('gameCanvas');
    canvas.style.display = 'block';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Core game loop logic can be expanded here
}
</script>
</body>
</html>
