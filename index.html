<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Escape 3D - Jumpscare Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .hud-element {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 12px 20px;
      color: #ffffff;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
    }
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    #status-msg {
      font-size: 20px;
      color: #ff3333;
      transition: color 0.3s ease;
    }
    #status-msg.has-key {
      color: #33ff33;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 11;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }
    #crosshair::before {
      top: 4px;
      left: 0;
      width: 10px;
      height: 2px;
    }
    #crosshair::after {
      top: 0;
      left: 4px;
      width: 2px;
      height: 10px;
    }
    #screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      pointer-events: auto;
    }
    #screen-overlay h1 {
      font-size: 48px;
      margin-bottom: 20px;
      color: #ff3333;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(255,51,51,0.5);
    }
    #screen-overlay p {
      font-size: 18px;
      margin-bottom: 30px;
      max-width: 600px;
      text-align: center;
      line-height: 1.6;
      color: #ccc;
    }
    .btn {
      background: #ff3333;
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 51, 51, 0.4);
      transition: all 0.2s ease;
      text-transform: uppercase;
    }
    .btn:hover {
      background: #ff5555;
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 51, 51, 0.6);
    }
    #fps-counter {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-family: monospace;
      font-size: 14px;
      color: #00ff00;
      background: rgba(0,0,0,0.5);
      padding: 4px 8px;
      border-radius: 4px;
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 14px;
      color: #aaa;
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 4px;
      text-align: right;
    }

    /* --- JUMPSCARE OVERLAY STYLES --- */
    #jumpscare-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
      background: #000;
      display: none;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      overflow: hidden;
    }
    #jumpscare-face {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: jumpscareShake 0.05s infinite alternate;
    }
    #jumpscare-face svg {
      width: 90vmin;
      height: 90vmin;
      filter: drop-shadow(0 0 30px #ff0000);
    }
    @keyframes jumpscareShake {
      0% { transform: scale(1.1) translate(-10px, -10px) rotate(-3deg); filter: invert(0); }
      50% { transform: scale(1.3) translate(15px, 10px) rotate(3deg); filter: invert(0.8) hue-rotate(180deg); }
      100% { transform: scale(1.2) translate(-5px, 15px) rotate(-1deg); filter: invert(0); }
    }
    #flash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ff0000;
      opacity: 0;
      z-index: 201;
      pointer-events: none;
    }
    @keyframes flashAnim {
      0% { opacity: 0.8; }
      50% { opacity: 0; }
      100% { opacity: 0.5; }
    }
    .flashing {
      animation: flashAnim 0.08s infinite alternate;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  
  <div id="crosshair"></div>

  <div id="ui-layer">
    <div id="top-bar">
      <div class="hud-element" id="status-msg">FIND THE KEY TO UNLOCK THE EXIT</div>
      <div class="hud-element" id="keys-count">KEY: 0/1</div>
    </div>
    <div id="fps-counter">FPS: 60</div>
    <div id="instructions">
      [WASD] Move | [MOUSE] Look Around | [SHIFT] Run | [ESC] Pause
    </div>
  </div>

  <!-- Jumpscare Display -->
  <div id="jumpscare-overlay">
    <div id="flash-screen" class="flashing"></div>
    <div id="jumpscare-face">
      <!-- Scary Stylized Cat in the Hat SVG Face -->
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Background Dark Halo -->
        <circle cx="100" cy="100" r="95" fill="#050000" stroke="#ff0000" stroke-width="4"/>
        
        <!-- Cat Face Base -->
        <path d="M 30,100 Q 100,180 170,100 Q 180,40 100,50 Q 20,40 30,100 Z" fill="#111" stroke="#fff" stroke-width="3"/>
        <path d="M 45,100 Q 100,165 155,100 Q 150,70 100,80 Q 50,70 45,100 Z" fill="#eee"/>
        
        <!-- Giant Terrifying Eyes -->
        <ellipse cx="70" cy="90" rx="22" ry="28" fill="#ff0000" stroke="#000" stroke-width="3"/>
        <ellipse cx="130" cy="90" rx="22" ry="28" fill="#ff0000" stroke="#000" stroke-width="3"/>
        <ellipse cx="70" cy="90" rx="6" ry="20" fill="#000"/>
        <ellipse cx="130" cy="90" rx="6" ry="20" fill="#000"/>
        <circle cx="68" cy="82" r="3" fill="#fff"/>
        <circle cx="128" cy="82" r="3" fill="#fff"/>

        <!-- Evil Nose -->
        <polygon points="100,105 90,115 110,115" fill="#ff0000"/>

        <!-- Screaming Mouth with Sharp Teeth -->
        <path d="M 50,130 Q 100,195 150,130 Q 100,120 50,130 Z" fill="#000" stroke="#ff0000" stroke-width="3"/>
        <!-- Top Teeth -->
        <polygon points="60,127 67,142 74,128" fill="#fff"/>
        <polygon points="76,128 84,147 92,129" fill="#fff"/>
        <polygon points="94,129 100,150 106,129" fill="#fff"/>
        <polygon points="108,129 116,147 124,128" fill="#fff"/>
        <polygon points="126,128 133,142 140,127" fill="#fff"/>
        <!-- Bottom Teeth -->
        <polygon points="65,148 72,135 79,153" fill="#fff"/>
        <polygon points="85,156 92,138 99,160" fill="#fff"/>
        <polygon points="101,160 108,138 115,156" fill="#fff"/>
        <polygon points="121,153 128,135 135,148" fill="#fff"/>

        <!-- Tall Striped Hat -->
        <path d="M 60,62 L 140,62 L 150,10 L 50,10 Z" fill="#cc0000" stroke="#000" stroke-width="3"/>
        <rect x="53" y="20" width="94" height="12" fill="#fff"/>
        <rect x="57" y="42" width="86" height="12" fill="#fff"/>
        <ellipse cx="100" cy="62" rx="50" ry="8" fill="#cc0000" stroke="#000" stroke-width="2"/>

        <!-- Whiskers -->
        <line x1="40" y1="110" x2="5" y2="100" stroke="#fff" stroke-width="3"/>
        <line x1="40" y1="118" x2="0" y2="120" stroke="#fff" stroke-width="3"/>
        <line x1="160" y1="110" x2="195" y2="100" stroke="#fff" stroke-width="3"/>
        <line x1="160" y1="118" x2="200" y2="120" stroke="#fff" stroke-width="3"/>
      </svg>
    </div>
  </div>

  <div id="screen-overlay">
    <h1 id="overlay-title">CAT ESCAPE</h1>
    <p id="overlay-desc">
      Click anywhere to start. Look around in 360 degrees using your mouse. Find the golden key and reach the exit... BUT DON'T LET THE CAT TOUCH YOU!
    </p>
    <button class="btn" id="start-btn">CLICK TO PLAY</button>
  </div>

  <!-- Include Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- AUDIO SYNTHESIS FOR JUMPSCARE SOUND ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playJumpscareSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      // 1. Loud Screaming Noise Generator (Buffer)
      const bufferSize = audioCtx.sampleRate * 1.5; // 1.5 seconds sound
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1; // White noise
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      // High pass filter for harsh screech
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(1000, now);
      filter.frequency.linearRampToValueAtTime(3000, now + 0.2);

      // Distorted Oscillator Layer 1 (Low harsh pitch)
      const osc1 = audioCtx.createOscillator();
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(150, now);
      osc1.frequency.exponentialRampToValueAtTime(60, now + 1.2);

      // Distorted Oscillator Layer 2 (High piercing pitch)
      const osc2 = audioCtx.createOscillator();
      osc2.type = 'square';
      osc2.frequency.setValueAtTime(800, now);
      osc2.frequency.linearRampToValueAtTime(1200, now + 0.1);
      osc2.frequency.exponentialRampToValueAtTime(200, now + 1.0);

      // Master Gain / Volume Envelope
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(1.0, now); // MAX VOLUME
      gain.gain.exponentialRampToValueAtTime(0.01, now + 1.4);

      // Connect Nodes
      noise.connect(filter);
      filter.connect(gain);
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      // Start Audio
      noise.start(now);
      osc1.start(now);
      osc2.start(now);

      noise.stop(now + 1.5);
      osc1.stop(now + 1.5);
      osc2.stop(now + 1.5);
    }

    // --- GAME STATE VARIABLES ---
    const STATE = {
      playing: false,
      hasKey: false,
      gameOver: false,
      won: false,
      fps: 60,
      frameCount: 0,
      lastFpsUpdate: performance.now()
    };

    // --- CONFIGURATION ---
    const CONFIG = {
      MAZE_SIZE: 15,
      CELL_SIZE: 10,
      WALL_HEIGHT: 8,
      PLAYER_SPEED: 8.0,
      PLAYER_RUN_SPEED: 14.0,
      PLAYER_RADIUS: 0.8,
      CAT_SPEED: 6.8,
      CAT_RADIUS: 1.1,
      FOV: 75,
      RENDER_DISTANCE: 120
    };

    // --- MAZE GENERATOR ---
    class MazeGenerator {
      constructor(size) {
        this.size = size;
        this.grid = Array(size).fill(null).map(() => Array(size).fill(null).map(() => ({
          visited: false,
          walls: { N: true, S: true, E: true, W: true }
        })));
      }

      generate() {
        const stack = [];
        let current = { x: 0, z: 0 };
        this.grid[0][0].visited = true;
        let visitedCount = 1;
        const totalCells = this.size * this.size;

        while (visitedCount < totalCells) {
          const neighbors = this.getUnvisitedNeighbors(current);
          if (neighbors.length > 0) {
            const next = neighbors[Math.floor(Math.random() * neighbors.length)];
            this.removeWall(current, next);
            stack.push(current);
            current = { x: next.x, z: next.z };
            this.grid[current.z][current.x].visited = true;
            visitedCount++;
          } else if (stack.length > 0) {
            current = stack.pop();
          }
        }
        return this.grid;
      }

      getUnvisitedNeighbors(cell) {
        const neighbors = [];
        const { x, z } = cell;

        if (z > 0 && !this.grid[z - 1][x].visited) neighbors.push({ x, z: z - 1, dir: 'N' });
        if (z < this.size - 1 && !this.grid[z + 1][x].visited) neighbors.push({ x, z: z + 1, dir: 'S' });
        if (x < this.size - 1 && !this.grid[z][x + 1].visited) neighbors.push({ x: x + 1, z, dir: 'E' });
        if (x > 0 && !this.grid[z][x - 1].visited) neighbors.push({ x: x - 1, z, dir: 'W' });

        return neighbors;
      }

      removeWall(a, b) {
        const dx = b.x - a.x;
        const dz = b.z - a.z;

        if (dx === 1) {
          this.grid[a.z][a.x].walls.E = false;
          this.grid[b.z][b.x].walls.W = false;
        } else if (dx === -1) {
          this.grid[a.z][a.x].walls.W = false;
          this.grid[b.z][b.x].walls.E = false;
        }
        if (dz === 1) {
          this.grid[a.z][a.x].walls.S = false;
          this.grid[b.z][b.x].walls.N = false;
        } else if (dz === -1) {
          this.grid[a.z][a.x].walls.N = false;
          this.grid[b.z][b.x].walls.S = false;
        }
      }
    }

    // --- THREE.JS SETUP ---
    let scene, camera, renderer;
    let playerObj, catObj, keyObj, doorObj;
    let wallBoxes = [];
    let clock = new THREE.Clock();

    const keys = { w: false, a: false, s: false, d: false, shift: false };
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    let cameraRotation = { yaw: 0, pitch: 0 };

    function initEngine() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0c);
      scene.fog = new THREE.FogExp2(0x0a0a0c, 0.025);

      camera = new THREE.PerspectiveCamera(CONFIG.FOV, window.innerWidth / window.innerHeight, 0.1, CONFIG.RENDER_DISTANCE);
      
      renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      buildWorld();
      setupControls();

      window.addEventListener('resize', onWindowResize, false);
    }

    // --- BUILD MAZE & ENTITIES ---
    function buildWorld() {
      const mazeGen = new MazeGenerator(CONFIG.MAZE_SIZE);
      const grid = mazeGen.generate();

      const wallMaterial = new THREE.MeshLambertMaterial({ color: 0x3a3a4a });
      const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x15151c });
      const ceilingMaterial = new THREE.MeshLambertMaterial({ color: 0x08080a });

      const totalWorldSize = CONFIG.MAZE_SIZE * CONFIG.CELL_SIZE;
      const floorGeo = new THREE.PlaneGeometry(totalWorldSize * 2, totalWorldSize * 2);
      
      const floor = new THREE.Mesh(floorGeo, floorMaterial);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(totalWorldSize / 2, 0, totalWorldSize / 2);
      scene.add(floor);

      const ceiling = new THREE.Mesh(floorGeo, ceilingMaterial);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.set(totalWorldSize / 2, CONFIG.WALL_HEIGHT, totalWorldSize / 2);
      scene.add(ceiling);

      for (let r = 0; r < CONFIG.MAZE_SIZE; r++) {
        for (let c = 0; c < CONFIG.MAZE_SIZE; c++) {
          const cell = grid[r][c];
          const x = c * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;
          const z = r * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2;

          if (cell.walls.N) createWallBlock(x, z - CONFIG.CELL_SIZE / 2, CONFIG.CELL_SIZE, 1);
          if (cell.walls.S) createWallBlock(x, z + CONFIG.CELL_SIZE / 2, CONFIG.CELL_SIZE, 1);
          if (cell.walls.E) createWallBlock(x + CONFIG.CELL_SIZE / 2, z, 1, CONFIG.CELL_SIZE);
          if (cell.walls.W) createWallBlock(x - CONFIG.CELL_SIZE / 2, z, 1, CONFIG.CELL_SIZE);
        }
      }

      function createWallBlock(x, z, w, d) {
        const geo = new THREE.BoxGeometry(w, CONFIG.WALL_HEIGHT, d);
        const wall = new THREE.Mesh(geo, wallMaterial);
        wall.position.set(x, CONFIG.WALL_HEIGHT / 2, z);
        scene.add(wall);

        const box = new THREE.Box3().setFromObject(wall);
        wallBoxes.push(box);
      }

      // Player Object
      playerObj = new THREE.Object3D();
      playerObj.position.set(CONFIG.CELL_SIZE / 2, 1.6, CONFIG.CELL_SIZE / 2);
      scene.add(playerObj);

      playerObj.add(camera);
      camera.position.set(0, 0, 0);

      // Key & Cat
      createKey(CONFIG.MAZE_SIZE - 2, CONFIG.MAZE_SIZE - 2);
      createCatInTheHat(CONFIG.MAZE_SIZE - 1, 1);
    }

    // --- CAT MODEL ---
    function createCatInTheHat(gridX, gridZ) {
      catObj = new THREE.Group();

      const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
      const whiteMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
      const redMat = new THREE.MeshLambertMaterial({ color: 0xcc1111 });

      const bodyGeo = new THREE.CylinderGeometry(0.6, 0.7, 2.5, 8);
      const body = new THREE.Mesh(bodyGeo, blackMat);
      body.position.y = 1.25;
      catObj.add(body);

      const chestGeo = new THREE.CylinderGeometry(0.45, 0.5, 1.8, 8, 1, false, -Math.PI / 4, Math.PI / 2);
      const chest = new THREE.Mesh(chestGeo, whiteMat);
      chest.position.set(0, 1.3, 0.15);
      catObj.add(chest);

      const headGeo = new THREE.SphereGeometry(0.6, 8, 8);
      const head = new THREE.Mesh(headGeo, blackMat);
      head.position.y = 2.8;
      catObj.add(head);

      const faceGeo = new THREE.SphereGeometry(0.55, 8, 8, 0, Math.PI);
      const face = new THREE.Mesh(faceGeo, whiteMat);
      face.position.set(0, 2.8, 0.1);
      face.rotation.y = -Math.PI / 2;
      catObj.add(face);

      const bowGeo = new THREE.BoxGeometry(0.6, 0.3, 0.2);
      const bow = new THREE.Mesh(bowGeo, redMat);
      bow.position.set(0, 2.3, 0.5);
      catObj.add(bow);

      const hatBrimGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.08, 12);
      const hatBrim = new THREE.Mesh(hatBrimGeo, redMat);
      hatBrim.position.set(0, 3.3, 0);
      catObj.add(hatBrim);

      const stripeHeight = 0.4;
      for (let i = 0; i < 5; i++) {
        const stripeGeo = new THREE.CylinderGeometry(0.6, 0.6, stripeHeight, 10);
        const stripeMat = (i % 2 === 0) ? whiteMat : redMat;
        const stripe = new THREE.Mesh(stripeGeo, stripeMat);
        stripe.position.set(0, 3.4 + (i * stripeHeight) + (stripeHeight / 2), 0);
        catObj.add(stripe);
      }

      catObj.position.set(
        gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
        0,
        gridZ * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2
      );

      scene.add(catObj);
    }

    // --- KEY ---
    function createKey(gridX, gridZ) {
      keyObj = new THREE.Group();

      const goldMat = new THREE.MeshLambertMaterial({ color: 0xffd700, emissive: 0x443300 });

      const ringGeo = new THREE.TorusGeometry(0.4, 0.1, 8, 16);
      const ring = new THREE.Mesh(ringGeo, goldMat);
      ring.position.y = 1.2;
      keyObj.add(ring);

      const shaftGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.0, 8);
      const shaft = new THREE.Mesh(shaftGeo, goldMat);
      shaft.position.y = 0.6;
      keyObj.add(shaft);

      keyObj.position.set(
        gridX * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2,
        0.5,
        gridZ * CONFIG.CELL_SIZE + CONFIG.CELL_SIZE / 2
      );

      scene.add(keyObj);
    }

    // --- EXIT DOOR ---
    function createGreenDoor() {
      doorObj = new THREE.Group();

      const greenDoorMat = new THREE.MeshLambertMaterial({ color: 0x00ff22, emissive: 0x00aa11 });
      const frameMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

      const frameGeo = new THREE.BoxGeometry(4.4, CONFIG.WALL_HEIGHT, 0.6);
      const frame = new THREE.Mesh(frameGeo, frameMat);
      frame.position.y = CONFIG.WALL_HEIGHT / 2;
      doorObj.add(frame);

      const doorPanelGeo = new THREE.BoxGeometry(4.0, CONFIG.WALL_HEIGHT - 0.4, 0.4);
      const doorPanel = new THREE.Mesh(doorPanelGeo, greenDoorMat);
      doorPanel.position.y = CONFIG.WALL_HEIGHT / 2;
      doorObj.add(doorPanel);

      const doorLight = new THREE.PointLight(0x00ff22, 2, 15);
      doorLight.position.set(0, CONFIG.WALL_HEIGHT / 2, 1.0);
      doorObj.add(doorLight);

      doorObj.position.set(CONFIG.CELL_SIZE / 2, 0, CONFIG.CELL_SIZE * 1.5);

      scene.add(doorObj);
    }

    // --- CONTROLS ---
    function setupControls() {
      const overlay = document.getElementById('screen-overlay');
      const startBtn = document.getElementById('start-btn');

      function requestLock() {
        initAudio(); // Initialize audio context on user click
        document.body.requestPointerLock();
      }

      startBtn.addEventListener('click', requestLock);
      overlay.addEventListener('click', requestLock);

      document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
          STATE.playing = true;
          overlay.style.display = 'none';
        } else {
          if (!STATE.gameOver && !STATE.won) {
            STATE.playing = false;
            overlay.style.display = 'flex';
            document.getElementById('overlay-title').innerText = 'PAUSED';
            document.getElementById('overlay-desc').innerText = 'Click anywhere to lock mouse and resume.';
            startBtn.innerText = 'RESUME';
          }
        }
      });

      // MOUSE LOOK AROUND
      document.addEventListener('mousemove', (e) => {
        if (!STATE.playing) return;

        const sensitivity = 0.0022;
        
        cameraRotation.yaw -= e.movementX * sensitivity;
        cameraRotation.pitch -= e.movementY * sensitivity;

        cameraRotation.pitch = Math.max(-Math.PI / 2.0 + 0.1, Math.min(Math.PI / 2.0 - 0.1, cameraRotation.pitch));

        euler.x = cameraRotation.pitch;
        euler.y = cameraRotation.yaw;
        euler.z = 0;

        camera.quaternion.setFromEuler(euler);
      });

      document.addEventListener('keydown', (e) => {
        switch (e.key.toLowerCase()) {
          case 'w': keys.w = true; break;
          case 'a': keys.a = true; break;
          case 's': keys.s = true; break;
          case 'd': keys.d = true; break;
          case 'shift': keys.shift = true; break;
        }
      });

      document.addEventListener('keyup', (e) => {
        switch (e.key.toLowerCase()) {
          case 'w': keys.w = false; break;
          case 'a': keys.a = false; break;
          case 's': keys.s = false; break;
          case 'd': keys.d = false; break;
          case 'shift': keys.shift = false; break;
        }
      });
    }

    // --- COLLISIONS & UPDATES ---
    function checkWallCollisions(newPos) {
      const playerRadius = CONFIG.PLAYER_RADIUS;

      for (let i = 0; i < wallBoxes.length; i++) {
        const box = wallBoxes[i];

        const closestX = Math.max(box.min.x, Math.min(newPos.x, box.max.x));
        const closestZ = Math.max(box.min.z, Math.min(newPos.z, box.max.z));

        const distX = newPos.x - closestX;
        const distZ = newPos.z - closestZ;
        const distanceSq = (distX * distX) + (distZ * distZ);

        if (distanceSq < (playerRadius * playerRadius)) {
          const distance = Math.sqrt(distanceSq);
          if (distance > 0) {
            const overlap = playerRadius - distance;
            newPos.x += (distX / distance) * overlap;
            newPos.z += (distZ / distance) * overlap;
          }
        }
      }
    }

    function updatePlayer(delta) {
      if (!STATE.playing) return;

      const speed = keys.shift ? CONFIG.PLAYER_RUN_SPEED : CONFIG.PLAYER_SPEED;
      const moveVector = new THREE.Vector3();

      if (keys.w) moveVector.z -= 1;
      if (keys.s) moveVector.z += 1;
      if (keys.a) moveVector.x -= 1;
      if (keys.d) moveVector.x += 1;

      moveVector.normalize();
      moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.yaw);

      const newPos = playerObj.position.clone().addScaledVector(moveVector, speed * delta);

      checkWallCollisions(newPos);

      playerObj.position.x = newPos.x;
      playerObj.position.z = newPos.z;
    }

    function updateCat(delta) {
      if (!catObj || !STATE.playing) return;

      const catPos = catObj.position;
      const targetPos = playerObj.position;

      const dir = new THREE.Vector3().subVectors(targetPos, catPos);
      dir.y = 0;

      const distToPlayer = dir.length();

      // TOUCH CAT -> TRIGGER JUMPSCARE
      if (distToPlayer < (CONFIG.CAT_RADIUS + CONFIG.PLAYER_RADIUS)) {
        triggerJumpscare();
        return;
      }

      dir.normalize();
      catObj.position.addScaledVector(dir, CONFIG.CAT_SPEED * delta);
      catObj.lookAt(targetPos.x, catObj.position.y, targetPos.z);
    }

    function checkInteractions() {
      if (!STATE.playing) return;

      if (keyObj && !STATE.hasKey) {
        keyObj.rotation.y += 0.02;

        const distToKey = playerObj.position.distanceTo(keyObj.position);
        if (distToKey < 2.0) {
          STATE.hasKey = true;
          scene.remove(keyObj);

          const statusElem = document.getElementById('status-msg');
          statusElem.innerText = 'KEY COLLECTED! FIND THE HIGHLIGHTED GREEN DOOR!';
          statusElem.classList.add('has-key');
          document.getElementById('keys-count').innerText = 'KEY: 1/1';

          createGreenDoor();
        }
      }

      if (doorObj && STATE.hasKey) {
        const distToDoor = playerObj.position.distanceTo(doorObj.position);
        if (distToDoor < 2.5) {
          triggerWin();
        }
      }
    }

    // --- JUMPSCARE & GAME OVER HANDLERS ---
    function triggerJumpscare() {
      STATE.playing = false;
      STATE.gameOver = true;
      document.exitPointerLock();

      // Show Jumpscare visual
      const jumpscareOverlay = document.getElementById('jumpscare-overlay');
      jumpscareOverlay.style.display = 'flex';

      // Play horrific screech audio
      playJumpscareSound();

      // Hold jumpscare on screen for 1.5 seconds, then show Game Over screen
      setTimeout(() => {
        jumpscareOverlay.style.display = 'none';

        const overlay = document.getElementById('screen-overlay');
        document.getElementById('overlay-title').innerText = 'YOU DIED!';
        document.getElementById('overlay-title').style.color = '#ff1111';
        document.getElementById('overlay-desc').innerText = 'The Cat in the Hat caught you!';

        const btn = document.getElementById('start-btn');
        btn.innerText = 'TRY AGAIN';
        btn.onclick = () => { location.reload(); };

        overlay.style.display = 'flex';
      }, 1500);
    }

    function triggerWin() {
      STATE.playing = false;
      STATE.won = true;
      document.exitPointerLock();

      const overlay = document.getElementById('screen-overlay');
      document.getElementById('overlay-title').innerText = 'YOU ESCAPED!';
      document.getElementById('overlay-title').style.color = '#00ff22';
      document.getElementById('overlay-desc').innerText = 'You opened the green door and escaped the Cat!';

      const btn = document.getElementById('start-btn');
      btn.innerText = 'PLAY AGAIN';
      btn.onclick = () => { location.reload(); };

      overlay.style.display = 'flex';
    }

    // --- GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      if (STATE.playing) {
        updatePlayer(delta);
        updateCat(delta);
        checkInteractions();
      }

      renderer.render(scene, camera);

      // FPS Monitor
      STATE.frameCount++;
      const now = performance.now();
      if (now - STATE.lastFpsUpdate >= 1000) {
        STATE.fps = STATE.frameCount;
        STATE.frameCount = 0;
        STATE.lastFpsUpdate = now;
        document.getElementById('fps-counter').innerText = `FPS: ${STATE.fps}`;
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = () => {
      initEngine();
      animate();
    };
  </script>
</body>
</html>
