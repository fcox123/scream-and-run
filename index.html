    <!-- GENERATE DYNAMIC HAY FAVICON VIA CANVAS DATA URI -->
    <script>
        (function generateFavicon() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            // Background Circle
            ctx.fillStyle = '#2a9d8f';
            ctx.beginPath();
            ctx.arc(32, 32, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw Straw Hay Bundle
            ctx.strokeStyle = '#e9c46a';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            for (let i = 0; i < 12; i++) {
                let angle = (i / 12) * Math.PI * 2;
                let x1 = 32 + Math.cos(angle) * 6;
                let y1 = 32 + Math.sin(angle) * 6;
                let x2 = 32 + Math.cos(angle + 0.3) * 22;
                let y2 = 32 + Math.sin(angle + 0.3) * 22;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            // Draw Needle Shiny Highlight
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(18, 46);
            ctx.lineTo(46, 18);
            ctx.stroke();

            // Needle Eye
            ctx.fillStyle = '#d4d4d8';
            ctx.beginPath();
            ctx.arc(44, 20, 2.5, 0, Math.PI * 2);
            ctx.fill();

            const link = document.createElement('link');
            link.rel = 'icon';
            link.href = canvas.toDataURL('image/png');
            document.head.appendChild(link);
        })();
    </script>

    <!-- MAIN GAME LOGIC SCRIPT -->
    <script>
        /* ==========================================================================
           1. PROCEDURAL SOUND SYNTHESIZER ENGINE (WEB AUDIO API)
           ========================================================================== */
        class AudioSynth {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Straw Rustle / Digging Noise FX
            playRustle() {
                this.init();
                let bufferSize = this.ctx.sampleRate * 0.12;
                let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                let noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                let filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1000 + Math.random() * 400, this.ctx.currentTime);
                filter.Q.setValueAtTime(4, this.ctx.currentTime);

                let gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start();
            }

            // Metal Detector Proximity Beep FX
            playBeep(pitchRatio = 1.0) {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600 * pitchRatio, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            // Rare Needle Discovery Fanfare FX
            playNeedleFound() {
                this.init();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                    gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            }

            // Sale Coin Chime FX
            playCoin() {
                this.init();
                const now = this.ctx.currentTime;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.07); // E6

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const audio = new AudioSynth();

        /* ==========================================================================

           ========================================================================== */
        let state = {
            hay: 0,

            searchPower: 1,

            needleSearchRadius: 1.5,
            upgrades: {
                pitchfork: { count: 0, cost: 20, baseCost: 20, power: 1, name: "Steel Pitchfork", desc: "+1 Hay per digging action." },
                sifter: { count: 0, cost: 50, baseCost: 50, power: 0.5, name: "Mesh Sifter Basket", desc: "Expands physical needle search reach radius." },

        /* ==========================================================================
           3. THREE.JS 3D ENGINE, REALISTIC STRAW INSTANCING & SCENE
           ========================================================================== */
        let scene, camera, renderer;
        let playerGroup, playerBody, pitchforkTool;
        let haystackGroup, strawInstancedMesh;
        let hiddenNeedleMesh;
        let farmerNPCGroup;
        let clock = new THREE.Clock();

        // 3D Straw Haystack Parameters
        const STRAW_COUNT = 3500;
        const HAYSTACK_CENTER = new THREE.Vector3(0, 0, 0);
        const HAYSTACK_RADIUS = 7.0;
        const HAYSTACK_HEIGHT = 4.5;

        let needlePosition = new THREE.Vector3();

        const LOCATIONS = {

        };

        function init3D() {
            const container = document.getElementById('render-canvas');

            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.018);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // WebGL Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting System
            const ambient = new THREE.AmbientLight(0xfff0dd, 0.5);
            scene.add(ambient);

            const moonLight = new THREE.DirectionalLight(0xe0f2fe, 0.8);

            moonLight.castShadow = true;
            moonLight.shadow.mapSize.width = 2048;
            moonLight.shadow.mapSize.height = 2048;
            moonLight.shadow.camera.near = 0.5;
            moonLight.shadow.camera.far = 120;
            const d = 35;
            moonLight.shadow.camera.left = -d;
            moonLight.shadow.camera.right = d;
            moonLight.shadow.camera.top = d;
            moonLight.shadow.camera.bottom = -d;
            scene.add(moonLight);

            // Warm Lantern Spot Light above Haystack
            const lanternLight = new THREE.PointLight(0xf59e0b, 1.5, 25);
            lanternLight.position.set(0, 8, 0);
            scene.add(lanternLight);

            // Build World Environments
            buildTerrain();
            buildVolumetricHaystack();

        /* ==========================================================================
           4. PROCEDURAL REALISTIC 3D MESH GENERATORS
           ========================================================================== */

        function buildTerrain() {
            // Ground Mesh
            const groundGeo = new THREE.PlaneGeometry(160, 160, 32, 32);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1c2d15, roughness: 0.95 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Dirt Pathway
            const pathGeo = new THREE.PlaneGeometry(6, 30);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0x4a321a, roughness: 1.0 });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.rotation.z = Math.PI / 3;
            path.position.set(9, 0.01, -6);
            path.receiveShadow = true;
            scene.add(path);

            // Surroundings Fences & Farm Deco
            for (let i = 0; i < 20; i++) {
                let angle = (i / 20) * Math.PI * 2;
                let r = 28;
                let x = Math.cos(angle) * r;
                let z = Math.sin(angle) * r;

                const postGeo = new THREE.BoxGeometry(0.4, 2.2, 0.4);
                const postMat = new THREE.MeshStandardMaterial({ color: 0x3f2314 });
                const post = new THREE.Mesh(postGeo, postMat);
                post.position.set(x, 1.1, z);
                post.castShadow = true;
                scene.add(post);
            }
        }

        // Generate Volumetric 3D Haystack out of 3,500 Instanced Straw Blades
        function buildVolumetricHaystack() {
            haystackGroup = new THREE.Group();

            // Inner Dark Core Dome Mesh
            const domeGeo = new THREE.SphereGeometry(HAYSTACK_RADIUS * 0.85, 16, 12);
            domeGeo.scale(1.0, HAYSTACK_HEIGHT / HAYSTACK_RADIUS, 1.0);
            const domeMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 1.0 });
            const domeCore = new THREE.Mesh(domeGeo, domeMat);
            domeCore.position.y = 0.2;
            domeCore.castShadow = true;
            domeCore.receiveShadow = true;
            haystackGroup.add(domeCore);

            // Single Straw Blade Geometry (Thin tapered curved strip)
            const strawGeo = new THREE.ConeGeometry(0.04, 1.2, 4);

            // Custom Straw Color Variations (Golden, Dried Yellow, Brownish)
            const strawMat = new THREE.MeshStandardMaterial({
                color: 0xeab308,
                roughness: 0.8,
                metalness: 0.1
            });

            strawInstancedMesh = new THREE.InstancedMesh(strawGeo, strawMat, STRAW_COUNT);
            strawInstancedMesh.castShadow = true;
            strawInstancedMesh.receiveShadow = true;

            const matrix = new THREE.Matrix4();
            const dummy = new THREE.Object3D();

            for (let i = 0; i < STRAW_COUNT; i++) {
                // Random position within haystack volumetric mound
                let u = Math.random();
                let v = Math.random();
                let theta = u * 2.0 * Math.PI;
                let phi = Math.acos(2.0 * v - 1.0);
                
                let r = Math.cbrt(Math.random()) * HAYSTACK_RADIUS;
                let x = r * Math.sin(phi) * Math.cos(theta);
                let z = r * Math.sin(phi) * Math.sin(theta);
                let y = Math.abs(r * Math.cos(phi)) * (HAYSTACK_HEIGHT / HAYSTACK_RADIUS);

                dummy.position.set(x, y, z);

                // Tangent/Jittered Tilting Rotation
                dummy.rotation.x = (Math.random() - 0.5) * Math.PI;
                dummy.rotation.y = Math.random() * Math.PI * 2;
                dummy.rotation.z = (Math.random() - 0.5) * Math.PI;

                let scaleScale = 0.7 + Math.random() * 0.6;
                dummy.scale.set(scaleScale, scaleScale, scaleScale);

                dummy.updateMatrix();
                strawInstancedMesh.setMatrixAt(i, dummy.matrix);
            }

            strawInstancedMesh.instanceMatrix.needsUpdate = true;
            haystackGroup.add(strawInstancedMesh);

            haystackGroup.position.copy(HAYSTACK_CENTER);
            scene.add(haystackGroup);
        }

        // Spawn Hidden Metallic Needle inside Haystack Volume
        function spawnRandomHiddenNeedle() {
            // Remove existing if present
            if (hiddenNeedleMesh) scene.remove(hiddenNeedleMesh);

            // Random Coordinate deep inside Haystack Mound
            let r = (0.2 + Math.random() * 0.7) * HAYSTACK_RADIUS;
            let angle = Math.random() * Math.PI * 2;
            let x = Math.cos(angle) * r;
            let z = Math.sin(angle) * r;
            let y = 0.3 + Math.random() * (HAYSTACK_HEIGHT * 0.6);

            needlePosition.set(x, y, z);

            // Realistic Shiny Metallic Needle Mesh
            const needleGroup = new THREE.Group();
            const bodyGeo = new THREE.CylinderGeometry(0.02, 0.04, 1.4, 12);
            const needleMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                metalness: 0.95,
                roughness: 0.1,
                emissive: 0x38bdf8,
                emissiveIntensity: 0.2
            });
            const needleBody = new THREE.Mesh(bodyGeo, needleMat);
            needleGroup.add(needleBody);

            // Eye Hole
            const eyeGeo = new THREE.TorusGeometry(0.05, 0.015, 8, 16);
            const eyeMesh = new THREE.Mesh(eyeGeo, needleMat);
            eyeMesh.position.y = 0.65;
            needleGroup.add(eyeMesh);

            needleGroup.position.copy(needlePosition);
            needleGroup.rotation.z = Math.PI / 4;
            needleGroup.rotation.x = Math.PI / 6;

            hiddenNeedleMesh = needleGroup;
            // Needle is hidden visually until discovered!
            hiddenNeedleMesh.visible = false;
            scene.add(hiddenNeedleMesh);
        }

        // Build 3D Character Mesh
        function buildPlayerCharacter() {
            playerGroup = new THREE.Group();

            // Torso
            const torsoGeo = new THREE.CylinderGeometry(0.45, 0.4, 1.3, 8);
            const torsoMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
            playerBody = new THREE.Mesh(torsoGeo, torsoMat);
            playerBody.position.y = 1.0;
            playerBody.castShadow = true;
            playerGroup.add(playerBody);

            // Head
            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.9;
            head.castShadow = true;
            playerGroup.add(head);

            // Pitchfork Tool Accessory
            const forkGroup = new THREE.Group();
            const shaftGeo = new THREE.CylinderGeometry(0.03, 0.03, 2.0);
            const shaftMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
            const shaft = new THREE.Mesh(shaftGeo, shaftMat);
            forkGroup.add(shaft);

            const headProngsGeo = new THREE.BoxGeometry(0.35, 0.25, 0.04);
            const prongsMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8 });
            const headProngs = new THREE.Mesh(headProngsGeo, prongsMat);
            headProngs.position.y = 1.0;
            forkGroup.add(headProngs);

            forkGroup.position.set(0.5, 1.1, 0.2);
            forkGroup.rotation.x = Math.PI / 6;
            pitchforkTool = forkGroup;
            playerGroup.add(pitchforkTool);

            playerGroup.position.copy(playerPos);
            scene.add(playerGroup);
        }

        // Build Farmer Trader NPC
        function buildFarmerNPC() {
            farmerNPCGroup = new THREE.Group();

            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.0;
            body.castShadow = true;
            farmerNPCGroup.add(body);

            const headGeo = new THREE.SphereGeometry(0.38);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.9;
            farmerNPCGroup.add(head);

            // Trading Table
            const tableGeo = new THREE.BoxGeometry(3.5, 1.1, 1.6);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x451a03 });
            const table = new THREE.Mesh(tableGeo, tableMat);
            table.position.set(0, 0.55, 1.2);
            table.castShadow = true;
            farmerNPCGroup.add(table);

            farmerNPCGroup.position.copy(LOCATIONS.FARMER);
            scene.add(farmerNPCGroup);
        }

        /* ==========================================================================
           5. CONTROLS, PHYSICAL SEARCH & DETECTOR SIGNAL
           ========================================================================== */

        function handleKey(e, isDown) {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = isDown;
            if (k === 'a') keys.a = isDown;
            if (k === 's') keys.s = isDown;
            if (k === 'd') keys.d = isDown;

            if (k === '1') selectSlot(1);
            if (k === '2') selectSlot(2);
            if (k === '3') selectSlot(3);
            if (k === '4') selectSlot(4);

            if ((k === 'e' || k === ' ') && isDown) {
                performContextAction();
            }
        }

        function selectSlot(slotNum) {
            state.activeSlot = slotNum;
            document.querySelectorAll('.hotbar-slot').forEach(el => el.classList.remove('active'));
            document.getElementById(`slot-${slotNum}`).classList.add('active');

            // Toggle Metal Detector HUD Visibility
            const detHud = document.getElementById('detector-hud');
            if (slotNum === 3) detHud.classList.add('active');
            else detHud.classList.remove('active');
        }

        function performContextAction() {
            let distToHay = playerPos.distanceTo(HAYSTACK_CENTER);
            let distToFarmer = playerPos.distanceTo(LOCATIONS.FARMER);

            if (distToHay <= HAYSTACK_RADIUS + 1.5) {
                digHaystackAction();
            } else if (distToFarmer <= 4.0) {
                toggleDrawer();
            }
        }

        // Dig/Search Haystack Interaction
        function digHaystackAction() {
            // Animate Pitchfork Dig Swing
            pitchforkTool.rotation.x = Math.PI / 1.8;
            setTimeout(() => pitchforkTool.rotation.x = Math.PI / 6, 220);

            audio.playRustle();

            let hayGained = state.searchPower;
            state.hay += hayGained;

            spawnScreenFloatText(`+${hayGained} Hay 🌾`, playerPos, "#f4a261");

            // Check if player physically found needle based on location & search reach radius
            let distToNeedle = playerPos.distanceTo(needlePosition);
            let effectiveRadius = state.needleSearchRadius;

            // Slot Bonuses
            if (state.activeSlot === 2) effectiveRadius *= 1.8; // Sifter bonus
            if (state.activeSlot === 4) effectiveRadius *= 2.5; // Magnet bonus

            if (distToNeedle <= effectiveRadius) {
                // NEEDLE FOUND!
                state.needles++;
                let coinBonus = 250 + Math.floor(Math.random() * 250);
                state.coins += coinBonus;

                audio.playNeedleFound();

                // Make Needle Visible & Flash
                hiddenNeedleMesh.visible = true;
                spawnScreenFloatText(`🪡 NEEDLE DISCOVERED! (+${coinBonus} Coins)`, needlePosition, "#ef4444");
                showToast(`🪡 AMAZING! You unearthed the needle deep inside the haystack! (+${coinBonus} Coins)`);

                // Respawn Needle in a new hard location after 2 seconds
                setTimeout(() => {
                    spawnRandomHiddenNeedle();
                }, 2000);
            }

            updateUI();
        }

        function sellHay(amount) {
            let toSell = 0;
            if (amount === 'all') toSell = state.hay;
            else if (amount === 'half') toSell = Math.floor(state.hay / 2);
            else toSell = Math.min(state.hay, amount);

            if (toSell > 0) {
                state.hay -= toSell;
                state.coins += toSell;
                audio.playCoin();
                spawnScreenFloatText(`+${toSell} Coins 🪙`, LOCATIONS.FARMER, "#2a9d8f");
                showToast(`Sold ${toSell} Hay to the farmer for ${toSell} Coins!`);
                updateUI();
            } else {
                showToast("You don't have any Hay to sell!");
            }
        }

        /* ==========================================================================
           6. TICK & RENDERING LOOP
           ========================================================================== */

        let lastBeepTime = 0;
        let lastPassiveSec = 0;

        function animate() {
            requestAnimationFrame(animate);

            let delta = clock.getDelta();
            let elapsed = clock.getElapsedTime();

            // Player Physics Movement
            updatePlayerPhysics(delta);

            // Third-Person Camera Smooth Follow
            camera.position.x = playerGroup.position.x;
            camera.position.y = playerGroup.position.y + 9;
            camera.position.z = playerGroup.position.z + 13;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);

            // Volumetric Straw Physical Interaction displacement (When player walks inside haystack)
            let distToHay = playerPos.distanceTo(HAYSTACK_CENTER);
            if (distToHay < HAYSTACK_RADIUS) {
                strawInstancedMesh.rotation.y = Math.sin(elapsed * 4) * 0.02;
            }

            // Proximity Detector Signal Logic
            updateMetalDetectorSignal(elapsed);

            // Context Interaction Prompts
            updateContextPrompts();

            // Idle Tycoon Passive Generation (1 Sec Interval)
            if (elapsed - lastPassiveSec >= 1.0) {
                passiveIncomeTick();
                lastPassiveSec = elapsed;
            }

            renderer.render(scene, camera);
        }

        function updatePlayerPhysics(delta) {
            let moveDir = new THREE.Vector3();

            if (keys.w) moveDir.z -= 1;
            if (keys.s) moveDir.z += 1;
            if (keys.a) moveDir.x -= 1;
            if (keys.d) moveDir.x += 1;

            if (moveDir.length() > 0) {
                moveDir.normalize();
                let moveSpeed = 9.0;

                // Slow down movement when walking through deep hay mound
                if (playerPos.distanceTo(HAYSTACK_CENTER) < HAYSTACK_RADIUS) {
                    moveSpeed = 4.5;
                }

                playerPos.x += moveDir.x * moveSpeed * delta;
                playerPos.z += moveDir.z * moveSpeed * delta;

                // Character Rotation
                playerGroup.rotation.y = Math.atan2(moveDir.x, moveDir.z);

                // Walking Animation Bobbing
                playerBody.position.y = 1.0 + Math.sin(clock.getElapsedTime() * 14) * 0.08;
            } else {
                playerBody.position.y = 1.0;
            }

            playerGroup.position.copy(playerPos);
        }

        function updateMetalDetectorSignal(elapsed) {
            let distToNeedle = playerPos.distanceTo(needlePosition);
            let maxDist = 18.0;
            let signalRatio = Math.max(0, Math.min(1, 1 - (distToNeedle / maxDist)));

            document.getElementById('signal-bar').style.width = `${(signalRatio * 100).toFixed(0)}%`;

            // Signal Beep Rate based on distance
            if (state.activeSlot === 3 && signalRatio > 0.1) {
                let beepInterval = 1.2 - (signalRatio * 1.0); // Beeps faster as player gets closer
                if (elapsed - lastBeepTime >= beepInterval) {
                    audio.playBeep(0.8 + signalRatio * 0.8);
                    lastBeepTime = elapsed;
                }
            }
        }

        function updateContextPrompts() {
            const prompt = document.getElementById('context-prompt');
            let distHay = playerPos.distanceTo(HAYSTACK_CENTER);
            let distFarmer = playerPos.distanceTo(LOCATIONS.FARMER);

            if (distHay <= HAYSTACK_RADIUS + 1.5) {
                prompt.style.display = 'block';
                prompt.innerText = "Press [E] or [Space] to Search Haystack";
            } else if (distFarmer <= 4.0) {
                prompt.style.display = 'block';
                prompt.innerText = "Press [E] or [Space] to Open Farmer Market";
            } else {
                prompt.style.display = 'none';
            }
        }

        function passiveIncomeTick() {
            if (state.autoHaySec > 0) {
                state.hay += state.autoHaySec;
            }

            if (state.autoSellSec > 0 && state.hay > 0) {
                let toSell = Math.min(state.hay, state.autoSellSec);
                state.hay -= toSell;
                state.coins += toSell;
            }

            updateUI();
        }

        /* ==========================================================================
           7. UPGRADES & UI DYNAMICS
           ========================================================================== */

        function buyUpgrade(key) {
            let upg = state.upgrades[key];
            if (state.coins >= upg.cost) {
                state.coins -= upg.cost;
                upg.count++;
                upg.cost = Math.floor(upg.baseCost * Math.pow(1.22, upg.count));

                recalculateStats();
                renderUpgradesUI();
                updateUI();
                showToast(`Upgraded ${upg.name}!`);
            } else {
                showToast("Not enough Coins!");
            }
        }

        function recalculateStats() {
            state.searchPower = 1 + (state.upgrades.pitchfork.count * state.upgrades.pitchfork.power);
            state.needleSearchRadius = 1.5 + (state.upgrades.sifter.count * state.upgrades.sifter.power);
            state.autoHaySec = (state.upgrades.helper.count * state.upgrades.helper.power);
            state.autoSellSec = (state.upgrades.trader.count * state.upgrades.trader.power);
        }

        function updateUI() {
            document.getElementById('val-hay').innerText = Math.floor(state.hay).toLocaleString();
            document.getElementById('val-coins').innerText = Math.floor(state.coins).toLocaleString();
            document.getElementById('val-needles').innerText = state.needles.toLocaleString();

            for (let key in state.upgrades) {
                let btn = document.getElementById(`upg-btn-${key}`);
                if (btn) btn.disabled = state.coins < state.upgrades[key].cost;
            }
        }

        function renderUpgradesUI() {
            const list = document.getElementById('upgrades-list');
            list.innerHTML = '';

            for (let key in state.upgrades) {
                let upg = state.upgrades[key];
                let card = document.createElement('div');
                card.className = 'upg-card';
                card.innerHTML = `
                    <div class="upg-card-head">
                        <h4>${upg.name}</h4>
                        <span class="lvl">Lvl ${upg.count}</span>
                    </div>
                    <div class="upg-desc">${upg.desc}</div>
                    <button class="btn-action" id="upg-btn-${key}" onclick="buyUpgrade('${key}')">
                        <span>Upgrade</span>
                        <span>🪙 ${upg.cost.toLocaleString()}</span>
                    </button>
                `;
                list.appendChild(card);
            }
        }

        function toggleDrawer() {
            document.getElementById('drawer-panel').classList.toggle('open');
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const item = document.createElement('div');
            item.className = 'toast-item';
            item.innerText = msg;
            container.appendChild(item);

            setTimeout(() => item.remove(), 4000);
        }

        function spawnScreenFloatText(text, worldPos, color) {
            const el = document.createElement('div');
            el.className = 'world-text-float';
            el.innerText = text;
            el.style.color = color;

            const proj = worldPos.clone().add(new THREE.Vector3(0, 2.2, 0)).project(camera);
            const x = (proj.x * .5 + .5) * window.innerWidth;
            const y = (-(proj.y * .5) + .5) * window.innerHeight;

            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 1200);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize 3D Engine on Window Load
        window.onload = init3D;
    </script>
</body>
